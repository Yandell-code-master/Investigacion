<header>
    <h1>Sistema de Gestión Comercial</h1>
</header>

<nav>
    <a routerLink="/" class="active">
        Clientes
    </a>

    <a routerLink="/productos">
        Productos
    </a>

    <a routerLink="/facturas">
        Facturas
    </a>
</nav>

<main class="container">

    <section class="card">

        <h2>Clientes</h2>

        <form>

            <input type="text" placeholder="Nombre del cliente" [(ngModel)]="nuevoNombre" name="nombre">

            <button type="button" (click)="saveCliente()">

                Guardar Cliente

            </button>

        </form>

    </section>

    <section class="card">

        <h3>Lista de Clientes</h3>

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                </tr>

            </thead>

            <tbody>

                @for(cliente of clientes(); track cliente.id) {

                <tr>

                    <td>
                        {{ cliente.id }}
                    </td>

                    <td>
                        {{ cliente.nombre }}
                    </td>

                </tr>

                }

            </tbody>

        </table>

    </section>

</main>
